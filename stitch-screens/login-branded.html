            background: rgba(255, 255, 255, 0.7);

<body class="bg-surface font-body text-on-surface selection:bg-secondary-fixed min-h-screen flex flex-col items-center justify-center overflow-hidden">
<!-- Top Navigation (Shell suppressed for Transactional View, but using JSON as guide for Logo style) -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-6 py-4 glass-header">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="security">security</span>
<span class="text-2xl font-black text-blue-900 tracking-tighter font-headline">USafe</span>
</div>
<button class="text-slate-500 font-label text-sm font-semibold hover:bg-slate-100 px-3 py-1 rounded-full transition-colors active:scale-95 duration-200">
            اردو
        </button>
</header>
<main class="w-full max-w-md px-6 pt-20 pb-12 flex flex-col flex-grow items-center justify-center">
<!-- Brand Identity Section -->
<div class="text-center mb-10 w-full">
<div class="inline-flex items-center justify-center w-20 h-20 rounded-xl compliance-arc-bg shadow-xl mb-6 transform rotate-3">
<span class="material-symbols-outlined text-white text-5xl" data-icon="construction" style="font-variation-settings: 'FILL' 1;">construction</span>
</div>
<h1 class="font-headline font-extrabold text-4xl text-primary tracking-tight mb-2">USafe</h1>
<p class="font-body text-on-surface-variant font-medium tracking-wide">Safety Compliance Portal</p>
</div>
<!-- Login Form Container -->
<div class="w-full bg-surface-container-lowest rounded-xl p-8 shadow-[0_8px_30px_rgb(0,0,0,0.04)] relative overflow-hidden">
<!-- Asymmetric Decorator -->
<div class="absolute -top-12 -right-12 w-24 h-24 bg-tertiary-container/10 rounded-full blur-2xl"></div>
<form class="space-y-6">
<!-- Email Input -->
<div class="space-y-2">
<label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant ml-1 font-label">Worker Email</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors" data-icon="mail">mail</span>
</div>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-low border-0 rounded-lg text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all font-medium" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant ml-1 font-label">Access Key</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors" data-icon="key">key</span>
</div>
<input class="w-full pl-12 pr-12 py-4 bg-surface-container-low border-0 rounded-lg text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/20 focus:bg-surface-container-lowest transition-all font-medium" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline hover:text-on-surface" type="button">
<span class="material-symbols-outlined text-xl" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password -->
<div class="flex justify-end">
<a class="text-sm font-semibold text-secondary hover:underline decoration-2 underline-offset-4" href="#">Forgot Password?</a>
</div>
<!-- Action Button -->
<button class="w-full py-4 px-6 compliance-arc-bg text-white font-headline font-bold text-lg rounded-full shadow-lg shadow-primary/20 hover:shadow-xl hover:shadow-primary/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2 group" type="submit">
                    Login to Dashboard
                    <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
</div>
<!-- Language & Help -->
<div class="mt-8 flex items-center gap-6">
<div class="flex bg-surface-container-high rounded-full p-1 shadow-inner">
<button class="px-4 py-1.5 rounded-full text-xs font-bold bg-white text-primary shadow-sm">ENGLISH</button>
<button class="px-4 py-1.5 rounded-full text-xs font-bold text-on-surface-variant">اردو</button>
</div>
<div class="h-4 w-[1px] bg-outline-variant/30"></div>
<a class="flex items-center gap-1.5 text-on-surface-variant hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-lg" data-icon="help">help</span>
<span class="text-xs font-bold uppercase tracking-tighter">Support</span>
</a>
</div>
</main>
<!-- Footer (Using JSON mapping) -->
<footer class="w-full py-8 flex flex-col items-center justify-center gap-2">
<p class="font-inter text-xs tracking-wide uppercase font-semibold text-slate-400">Powered by Innidata</p>
<div class="flex gap-4">
<a class="font-inter text-xs tracking-wide uppercase font-semibold text-slate-400 hover:text-orange-600 transition-colors" href="#">Terms of Service</a>
<span class="text-slate-400/30 text-xs">•</span>
<a class="font-inter text-xs tracking-wide uppercase font-semibold text-slate-400 hover:text-orange-600 transition-colors" href="#">Privacy Policy</a>
</div>
</footer>

<div class="fixed -bottom-24 -left-24 w-64 h-64 compliance-arc-bg opacity-5 rounded-full blur-3xl pointer-events-none"></div>
