<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reporting Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"
    integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
    integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
    crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"
    integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
    crossorigin="anonymous"></script>
  <script src="https://kit.fontawesome.com/b576bd8d3c.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="../../css/reportDetails.css">
  <link rel="stylesheet" href="../../css/dropDown.css">
  <!-- <link rel="stylesheet" href="../../Components/dateTime/dateTime.css"> -->
  <link rel="stylesheet" href="../../css/header.css">
  <link rel="stylesheet" href="../../css/loader.css">
  <link rel="stylesheet" href="../../css/usafe-global.css">
  <script src="../../Templates/Header.js"></script>
  <script src="../../Templates/GenericCheckList.js"></script>
  <script src="../../Js/Authentication/CheckUser.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.all.min.js" crossorigin="anonymous"></script>
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/usafe-swal.css">

    <style>
        :root {
            --safety-yellow: #f5b700;
            --safety-yellow-dark: #e5a100;
            --charcoal: #2d2d2d;
            --white: #ffffff;
            --surface: #fafafa;
            --text-dark: #1a1a1a;
            --text-mid: #666666;
            --text-light: #999999;
            --border: #e8e8e8;
            --radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background: var(--surface);
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* ===== CONTAINER ===== */
        .RepDetailsContainer {
            max-width: 500px;
            margin: 0 auto;
            padding: 16px;
            margin-top: 60px;
            margin-bottom: 80px;
        }

        .RepDetailsContent {
            width: 100% !important;
        }

        /* ===== FORM FIELDS ===== */
        .DropContainer {
            margin-bottom: 4px;
        }

        .DropHeaders {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-mid);
            margin-bottom: 2px;
        }

        .dropContent {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .dropContent p {
            margin: 0;
        }

        .DetailTextArea {
            margin-top: 16px;
        }

        .DetailTextArea label {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-mid);
        }

        .DetailTextArea .dropContent {
            font-size: 14px;
            line-height: 1.5;
        }

        /* ===== DATE/TIME ===== */
        .DateTimeContainer {
            gap: 12px;
        }

        .reportDetailContainer {
            background: var(--white) !important;
            border-radius: 12px;
            padding: 12px 16px;
            margin-top: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .reportDetailContent {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-mid);
        }

        .reportDetailContainer h2 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px !important;
            font-weight: 600;
            color: var(--text-dark);
            margin: 0;
        }

        .reportDetailContainer i {
            color: var(--safety-yellow-dark);
            font-size: 16px;
        }

        /* ===== PHOTOS ===== */
        .RepPhoto {
            margin-top: 16px;
        }

        .RepPhoto label {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-mid);
        }

        .RepPhoto img {
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        /* ===== DIVIDERS ===== */
        hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 12px 0;
        }

        /* ===== LOADER ===== */
        #load {
            width: 100%;
            height: 100%;
            position: fixed;
            z-index: 9999;
            background: url("../../assets/Dual Ring-1s-200px.gif") no-repeat center center rgba(250,250,250,0.85);
        }
    </style>
</head>

<body>
  <span id="load"></span>

  <div id="header"></div>
  <div class='RepDetailsContainer'>
    <div class='RepDetailsContent' id="detailsDiv">
    </div>

  </div>
  <script src="../../Global/URLS.js"></script>
  <script src="../../Helpers/HttpHandler.js"></script>
  <script src="../../Js/HeaderTitle.js"></script>
  <!-- Risk assessment branch below needs RISK_CATEGORY_COLOUR (RiskMatrix.js) and
       escapeHtml (RiskAssessmentCard.js) - loaded here rather than duplicated. -->
  <script src="../../Js/RiskMatrix.js"></script>
  <script src="../../Templates/RiskAssessmentCard.js"></script>

  <script>
    //get query string from url
    var url_string = window.location.href;
    var url = new URL(url_string);
    var id = url.searchParams.get("id");
    var entity = url.searchParams.get("entity");
    sendRequest(`api/ChangeForm/fetchTaskDetails?id=${id}&entity=${entity}`, 'GET', {}, data => {
      console.log(data);
      let html = "";
      //if change form data is present then create html for it
      if (data.values) {
        let values = JSON.parse(data.values);
        //iterate over values and create html from it. object key as a label and object value as a value of input element
        for (const key in values) {
          if (key === 'FileCategories') continue; // internal: used to label photos below
          if (values.hasOwnProperty(key)) {
            const element = values[key];
            if (key == 'Date') {
              html += ` 
              <div class='DateTimeContainer'>

                <div class='reportDetailContainer'>
                        <p class='reportDetailContent' style="font-weight:bold">${key}</p>
                        <h2 style="font-size:1rem">${new Date(element).toDateString()}</h2>
                        <i class="fa fa-calendar-minus-o" aria-hidden="true"></i>
                </div>
                <div class='reportDetailContainer'>
                  <p class='reportDetailContent' style="font-weight:bold">Time</p>
                  <h2 style="font-size:1rem">${new Date(element).toLocaleTimeString()}</h2>
                  <i class="fa fa-clock-o" aria-hidden="true"></i>
                </div>  
              </div>    
                `;
            }
            else if (key == "Description") {
              html += `<div class='DetailTextArea'>
      <label class='DropHeaders'>${key}</label>
      <p class='dropContent' >${element}</p>
    </div>`;
            }
            else {
              html += `<div class='DropContainer'>
      <p class='DropHeaders'>${key}</p>
      <div class='dropContent'>
          <p>${element}</p>
      </div>
  </div>`
            }
          }
          //add a line
          html += `<hr>`;
        }
        if (data.files) {
          let files = JSON.parse(data.files);
          let cats = [];
          try { if (values && values.FileCategories) cats = JSON.parse(values.FileCategories); } catch (e) { }
          for (let id = 0; id < files.length; id++) {
            const element = files[id];
            const label = cats[id] ? cats[id] : 'Photos';
            html += ` <div class='RepPhoto'>
      <label>${label}</label>
      <img src="${element}" />
    </div>`;
          }
        }
      }
      //if checklist data is present then create html for it
      else if(data.checkListData){
        // Show form info
        if (data.formName) {
          html += `<div style="padding:12px 0 8px;"><strong style="font-size:16px;">${data.formName}</strong>
            <span style="display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;background:${data.status==='Pending'?'#fff8e1':'#dcfce7'};color:${data.status==='Pending'?'#b8860b':'#16a34a'};margin-left:8px;">${data.status || ''}</span>
            <div style="font-size:12px;color:#888;margin-top:4px;">By ${data.reportedBy || ''} &middot; ${data.createdDate ? new Date(data.createdDate).toLocaleDateString() : ''}</div>
          </div><hr>`;
        }
        // Show header values
        if (data.headerValues && data.headerValues.length) {
          data.headerValues.forEach(hv => {
            html += `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0f0f0;">
              <span style="font-size:13px;color:#888;font-weight:600;">${hv.fieldLabel}</span>
              <span style="font-size:13px;font-weight:600;">${hv.fieldValue}</span>
            </div>`;
          });
          html += `<hr>`;
        }
        // Show checklist answers
        let questions = data.checkListData;
        questions.forEach((q, i) => {
          const isPositive = ['Yes','Pass','Compliant','Acknowledged'].includes(q.responseValue || q.compliance);
          const color = isPositive ? '#16a34a' : '#dc2626';
          const bg = isPositive ? '#dcfce7' : '#fee2e2';
          html += `<div style="padding:10px 0;border-bottom:1px solid #f5f5f5;">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;">
              <span style="font-size:13px;flex:1;line-height:1.4;">${i+1}. ${q.question}</span>
              <span style="font-size:12px;font-weight:700;color:${color};background:${bg};padding:2px 10px;border-radius:10px;margin-left:8px;white-space:nowrap;">${q.responseValue || q.compliance}</span>
            </div>
            ${q.remarks ? `<div style="font-size:12px;color:#888;margin-top:4px;">Remarks: ${q.remarks}</div>` : ''}
            ${q.actions ? `<div style="font-size:12px;color:#888;margin-top:2px;">Actions: ${q.actions}</div>` : ''}
          </div>`;
        });
      }
      else if (data.actions){
        let actions = data.actions;
        html = createSafetyActionsHtml(actions);
        html += `</div>`;
      }
      // Risk assessment (v2, nested task -> hazard -> control tree). Distinct
      // shape from the three branches above (see ChangeFormController.
      // GetTaskDetails, "RiskAssessment" case): riskAssessmentData is an
      // object - activity/typeOfActivity/location/eventActivities plus
      // tasks[].hazards[].controls[], ordered by sortOrder at every level -
      // not a flat array of TaskName/Hazard/Rating rows like v1, so it needs
      // its own rendering rather than being forced into the checklist
      // branch. Ratings/categories are computed and stored server-side -
      // render them here, never recalculate.
      else if (data.riskAssessmentData) {
        const ra = data.riskAssessmentData;
        const raStatusColors = {
          Pending: { bg: '#fff8e1', fg: '#b8860b' },
          Approved: { bg: '#dcfce7', fg: '#16a34a' },
          Rejected: { bg: '#fee2e2', fg: '#dc2626' }
        };
        const raStatus = raStatusColors[data.status] || raStatusColors.Pending;

        // Header: activity, status, form name, reported by + date.
        html += `<div style="padding:12px 0 8px;"><strong style="font-size:16px;">${escapeHtml(ra.activity || data.formName || '')}</strong>
          <span style="display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;background:${raStatus.bg};color:${raStatus.fg};margin-left:8px;">${escapeHtml(data.status || '')}</span>
          <div style="font-size:12px;color:#888;margin-top:4px;">${escapeHtml(data.formName || '')}</div>
          <div style="font-size:12px;color:#888;margin-top:2px;">By ${escapeHtml(data.reportedBy || '')} &middot; ${data.createdDate ? new Date(data.createdDate).toLocaleDateString() : ''}</div>
        </div><hr>`;

        if (ra.typeOfActivity) {
          html += `<div class='DropContainer'>
      <p class='DropHeaders'>Type of Activity</p>
      <div class='dropContent'>
          <p>${escapeHtml(ra.typeOfActivity)}</p>
      </div>
  </div>`;
        }
        if (ra.location) {
          html += `<div class='DropContainer'>
      <p class='DropHeaders'>Location</p>
      <div class='dropContent'>
          <p>${escapeHtml(ra.location)}</p>
      </div>
  </div>`;
        }
        if (ra.eventActivities) {
          html += `<div class='DropContainer'>
      <p class='DropHeaders'>Event Activities</p>
      <div class='dropContent'>
          <p>${escapeHtml(ra.eventActivities)}</p>
      </div>
  </div>`;
        }
        if (data.department) {
          html += `<div class='DropContainer'>
      <p class='DropHeaders'>Department</p>
      <div class='dropContent'>
          <p>${escapeHtml(data.department)}</p>
      </div>
  </div>`;
        }
        if (data.area) {
          html += `<div class='DropContainer'>
      <p class='DropHeaders'>Area</p>
      <div class='dropContent'>
          <p>${escapeHtml(data.area)}</p>
      </div>
  </div>`;
        }
        if (data.createdDate) {
          html += `
              <div class='DateTimeContainer'>
                <div class='reportDetailContainer'>
                        <p class='reportDetailContent' style="font-weight:bold">Date</p>
                        <h2 style="font-size:1rem">${new Date(data.createdDate).toDateString()}</h2>
                        <i class="fa fa-calendar-minus-o" aria-hidden="true"></i>
                </div>
                <div class='reportDetailContainer'>
                  <p class='reportDetailContent' style="font-weight:bold">Time</p>
                  <h2 style="font-size:1rem">${new Date(data.createdDate).toLocaleTimeString()}</h2>
                  <i class="fa fa-clock-o" aria-hidden="true"></i>
                </div>
              </div>`;
        }
        html += `<hr>`;

        // Tasks -> hazards -> controls. Only one nesting seam gets its own
        // wrapper element (.rd-ra-hazard-list, indented with a left rule
        // under its task) - three full levels of boxed cards is too much
        // chrome for a phone, so a hazard also repeats "Task N - Hazard M"
        // right above its own content as a lightweight breadcrumb, in case
        // the assessor has scrolled past the task header while reading a
        // task with several hazards.
        let tasks = (ra && ra.tasks) || [];
        if (!tasks.length) {
          html += `<p class="dropContent">No tasks recorded.</p>`;
        } else {
          tasks.forEach((task, ti) => {
            const hazards = task.hazards || [];

            let hazardsHtml;
            if (!hazards.length) {
              hazardsHtml = `<p class="rd-ra-empty-hint" style="font-size:12px;color:#999999;font-style:italic;padding:6px 0 2px;">No hazards logged for this task.</p>`;
            } else {
              hazardsHtml = hazards.map((hazard, hi) => {
                const baseColor = RISK_CATEGORY_COLOUR[hazard.baseCategory] || 'transparent';
                const residualColor = RISK_CATEGORY_COLOUR[hazard.residualCategory] || 'transparent';

                // The whole point of the assessment is the drop from base to
                // residual risk. The two category chips are already computed
                // and stored server-side (never recalculated here) - CATEGORY_ORDER,
                // defined once in Templates/RiskAssessmentCard.js and reused
                // here rather than duplicated, only ranks those two known
                // strings so the connecting arrow can be coloured green
                // (residual improved), red (residual worse) or grey (unchanged).
                const baseRank = CATEGORY_ORDER.indexOf(hazard.baseCategory);
                const residualRank = CATEGORY_ORDER.indexOf(hazard.residualCategory);
                let trendClass = 'rd-ra-trend-flat';
                let trendArrow = '&rarr;';
                let trendColor = '#999999';
                if (baseRank !== -1 && residualRank !== -1) {
                  if (residualRank < baseRank) { trendClass = 'rd-ra-trend-down'; trendArrow = '&darr;'; trendColor = '#16a34a'; }
                  else if (residualRank > baseRank) { trendClass = 'rd-ra-trend-up'; trendArrow = '&uarr;'; trendColor = '#dc2626'; }
                }

                const controls = hazard.controls || [];
                const controlsHtml = controls.length
                  ? `<ul class="rd-ra-controls" style="margin:4px 0 0;padding-left:18px;font-size:12px;color:#1a1a1a;">${controls.map(c => `<li>${escapeHtml(c.controlText)}</li>`).join('')}</ul>`
                  : `<p class="rd-ra-no-controls" style="font-size:12px;color:#999999;font-style:italic;margin:4px 0 0;">No controls recorded.</p>`;

                return `<div class="rd-ra-hazard" style="background:#fafafa;border-radius:10px;padding:10px 12px;margin-top:${hi === 0 ? '10px' : '8px'};">
                  <div class="rd-ra-hazard-context" style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#999999;margin-bottom:4px;">Task ${ti + 1} &middot; Hazard ${hi + 1}</div>
                  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
                    <span class="rd-ra-hazard-text" style="font-size:13px;font-weight:700;flex:1;line-height:1.4;">${escapeHtml(hazard.hazardText)}</span>
                    <span style="font-size:11px;font-weight:700;background:#e8e8e8;color:#666666;padding:2px 8px;border-radius:10px;white-space:nowrap;">${escapeHtml(hazard.actOrCondition)}</span>
                  </div>
                  <div style="font-size:12px;color:#666666;margin-top:6px;">Person at risk: ${escapeHtml(hazard.personAtRisk) || '-'}</div>

                  <div style="margin-top:8px;">
                    <p style="font-size:11px;font-weight:700;text-transform:uppercase;color:#999999;margin:0 0 2px;">Controls</p>
                    ${controlsHtml}
                  </div>

                  <div class="rd-ra-risk-transition" style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed #e8e8e8;">
                    <div style="flex:1;text-align:center;">
                      <span style="display:block;font-size:10px;font-weight:700;text-transform:uppercase;color:#999999;">Base</span>
                      <span class="rd-ra-category rd-ra-base-category" style="display:inline-block;margin-top:3px;padding:3px 12px;border-radius:12px;font-size:13px;font-weight:800;color:#333333;background:${baseColor};">${escapeHtml(hazard.baseCategory)}</span>
                      <span style="display:block;font-size:10px;color:#888888;margin-top:3px;">S${escapeHtml(hazard.baseSeverity)}&times;P${escapeHtml(hazard.baseProbability)}=${escapeHtml(hazard.baseRating)}</span>
                    </div>
                    <span class="rd-ra-risk-arrow ${trendClass}" style="font-size:20px;font-weight:800;flex:0 0 auto;color:${trendColor};">${trendArrow}</span>
                    <div style="flex:1;text-align:center;">
                      <span style="display:block;font-size:10px;font-weight:700;text-transform:uppercase;color:#999999;">Residual</span>
                      <span class="rd-ra-category rd-ra-residual-category" style="display:inline-block;margin-top:3px;padding:3px 12px;border-radius:12px;font-size:13px;font-weight:800;color:#333333;background:${residualColor};">${escapeHtml(hazard.residualCategory)}</span>
                      <span style="display:block;font-size:10px;color:#888888;margin-top:3px;">S${escapeHtml(hazard.residualSeverity)}&times;P${escapeHtml(hazard.residualProbability)}=${escapeHtml(hazard.residualRating)}</span>
                    </div>
                  </div>
                </div>`;
              }).join('');
            }

            html += `<div class="rd-ra-task" style="background:#ffffff;border-radius:12px;padding:12px 14px;margin-bottom:14px;border-left:4px solid #f5b700;box-shadow:0 2px 8px rgba(0,0,0,0.04);">
              <div style="display:flex;align-items:baseline;gap:8px;">
                <span style="font-size:11px;font-weight:800;text-transform:uppercase;color:#999999;white-space:nowrap;">Task ${ti + 1}</span>
                <span class="rd-ra-taskname" style="font-size:14px;font-weight:700;line-height:1.4;">${escapeHtml(task.taskName)}</span>
              </div>
              <div class="rd-ra-hazard-list" style="margin-left:8px;padding-left:10px;border-left:2px solid #e8e8e8;">${hazardsHtml}</div>
            </div>`;
          });
        }
      }


      $("#detailsDiv").html(html);
    });
    </script>
    <script>
    //create an on focus event and onfocus call fetchReport Function
    document.onreadystatechange = function () {
      var state = document.readyState
      if (state == 'complete') {
        setTimeout(function () {
          document.getElementById('interactive');
          document.getElementById('load').style.visibility = "hidden";
        }, 1000);
      }
    }
  </script>
  <script src="../../Components/bottomNav/bottomNav.js"></script>
</body>

</html>
