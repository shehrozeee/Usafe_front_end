<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reporting Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"
    integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
    integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"
    integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
    crossorigin="anonymous"></script>
  <script src="https://kit.fontawesome.com/b576bd8d3c.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="../../css/reportDetails.css">
  <link rel="stylesheet" href="../../css/dropDown.css">

  <link rel="stylesheet" href="../../css/header.css">
  <link rel="stylesheet" href="../../css/loader.css">
  <link rel="stylesheet" href="../../css/usafe-global.css">
  <script src="../../Templates/Header.js"></script>
  <script src="../../Templates/GenericCheckList.js"></script>
  <script src="../../Js/Authentication/CheckUser.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.all.min.js" crossorigin="anonymous"></script>
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/usafe-swal.css">

    <style>
        :root {
            --safety-yellow: #f5b700;
            --safety-yellow-dark: #e5a100;
            --charcoal: #2d2d2d;
            --white: #ffffff;
            --surface: #fafafa;
            --text-dark: #1a1a1a;
            --text-mid: #666666;
            --text-light: #999999;
            --border: #e8e8e8;
            --radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background: var(--surface);
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* ===== CONTAINER ===== */
        .RepDetailsContainer {
            max-width: 500px;
            margin: 0 auto;
            padding: 16px;
            margin-top: 60px;
            margin-bottom: 80px;
        }

        .RepDetailsContent {
            width: 100% !important;
        }

        /* ===== FORM FIELDS ===== */
        .DropContainer {
            margin-bottom: 4px;
        }

        .DropHeaders {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-mid);
            margin-bottom: 2px;
        }

        .dropContent {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .dropContent p {
            margin: 0;
        }

        .DetailTextArea {
            margin-top: 16px;
        }

        .DetailTextArea label {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-mid);
        }

        .DetailTextArea .dropContent {
            font-size: 14px;
            line-height: 1.5;
        }

        /* ===== DATE/TIME ===== */
        .DateTimeContainer {
            gap: 12px;
        }

        .reportDetailContainer {
            background: var(--white) !important;
            border-radius: 12px;
            padding: 12px 16px;
            margin-top: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .reportDetailContent {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-mid);
        }

        .reportDetailContainer h2 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px !important;
            font-weight: 600;
            color: var(--text-dark);
            margin: 0;
        }

        .reportDetailContainer i {
            color: var(--safety-yellow-dark);
            font-size: 16px;
        }

        /* ===== PHOTOS ===== */
        .RepPhoto {
            margin-top: 16px;
        }

        .RepPhoto label {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-mid);
        }

        .RepPhoto img {
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        /* ===== DIVIDERS ===== */
        hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 12px 0;
        }

        /* ===== LOADER ===== */
        #load {
            width: 100%;
            height: 100%;
            position: fixed;
            z-index: 9999;
            background: url("../../assets/Dual Ring-1s-200px.gif") no-repeat center center rgba(250,250,250,0.85);
        }
    </style>
</head>

<body>
  <span id="load"></span>

  <div id="header"></div>
  <div class='RepDetailsContainer'>
    <div class='RepDetailsContent' id="detailsDiv">
    </div>

  </div>
  <script src="../../Global/URLS.js"></script>
  <script src="../../Helpers/HttpHandler.js"></script>
  <script src="../../Js/HeaderTitle.js"></script>

  <script>
    //get query string from url
    var url_string = window.location.href;
    var url = new URL(url_string);
    var id = url.searchParams.get("id");
    var entity = url.searchParams.get("entity");
    sendRequest(`api/ChangeForm/fetchTaskDetails?id=${id}&entity=${entity}`, 'GET', {}, data => {
      console.log(data);
      let html = "";
      //if change form data is present then create html for it
      if (data.values) {
        let values = JSON.parse(data.values);
        //iterate over values and create html from it. object key as a label and object value as a value of input element
        for (const key in values) {
          if (key === 'FileCategories') continue; // internal: used to label photos below
          if (values.hasOwnProperty(key)) {
            const element = values[key];
            if (key == 'Date') {
              html += ` 
              <div class='DateTimeContainer'>

                <div class='reportDetailContainer'>
                        <p class='reportDetailContent' style="font-weight:bold">${key}</p>
                        <h2 style="font-size:1rem">${new Date(element).toDateString()}</h2>
                        <i class="fa fa-calendar-minus-o" aria-hidden="true"></i>
                </div>
                <div class='reportDetailContainer'>
                  <p class='reportDetailContent' style="font-weight:bold">Time</p>
                  <h2 style="font-size:1rem">${new Date(element).toLocaleTimeString()}</h2>
                  <i class="fa fa-clock-o" aria-hidden="true"></i>
                </div>  
              </div>    
                `;
            }
            else if (key == "Description") {
              html += `<div class='DetailTextArea'>
      <label class='DropHeaders'>${key}</label>
      <p class='dropContent' >${element}</p>
    </div>`;
            }
            else {
              html += `<div class='DropContainer'>
      <p class='DropHeaders'>${key}</p>
      <div class='dropContent'>
          <p>${element}</p>
      </div>
  </div>`
            }
          }
          //add a line
          html += `<hr>`;
        }
        if (data.files) {
          let files = JSON.parse(data.files);
          let cats = [];
          try { if (values && values.FileCategories) cats = JSON.parse(values.FileCategories); } catch (e) { }
          for (let id = 0; id < files.length; id++) {
            const element = files[id];
            const label = cats[id] ? cats[id] : 'Photos';
            html += ` <div class='RepPhoto'>
      <label>${label}</label>
      <img src="${element}" />
    </div>`;
          }
        }
      }
      //if checklist data is present then create html for it
      else if(data.checkListData){
        // Show form info
        if (data.formName) {
          html += `<div style="padding:12px 0 8px;"><strong style="font-size:16px;">${data.formName}</strong>
            <span style="display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;background:${data.status==='Pending'?'#fff8e1':'#dcfce7'};color:${data.status==='Pending'?'#b8860b':'#16a34a'};margin-left:8px;">${data.status || ''}</span>
            <div style="font-size:12px;color:#888;margin-top:4px;">By ${data.reportedBy || ''} &middot; ${data.createdDate ? new Date(data.createdDate).toLocaleDateString() : ''}</div>
          </div><hr>`;
        }
        // Show header values
        if (data.headerValues && data.headerValues.length) {
          data.headerValues.forEach(hv => {
            html += `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0f0f0;">
              <span style="font-size:13px;color:#888;font-weight:600;">${hv.fieldLabel}</span>
              <span style="font-size:13px;font-weight:600;">${hv.fieldValue}</span>
            </div>`;
          });
          html += `<hr>`;
        }
        // Show checklist answers
        let questions = data.checkListData;
        questions.forEach((q, i) => {
          const isPositive = ['Yes','Pass','Compliant','Acknowledged'].includes(q.responseValue || q.compliance);
          const color = isPositive ? '#16a34a' : '#dc2626';
          const bg = isPositive ? '#dcfce7' : '#fee2e2';
          html += `<div style="padding:10px 0;border-bottom:1px solid #f5f5f5;">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;">
              <span style="font-size:13px;flex:1;line-height:1.4;">${i+1}. ${q.question}</span>
              <span style="font-size:12px;font-weight:700;color:${color};background:${bg};padding:2px 10px;border-radius:10px;margin-left:8px;white-space:nowrap;">${q.responseValue || q.compliance}</span>
            </div>
            ${q.remarks ? `<div style="font-size:12px;color:#888;margin-top:4px;">Remarks: ${q.remarks}</div>` : ''}
            ${q.actions ? `<div style="font-size:12px;color:#888;margin-top:2px;">Actions: ${q.actions}</div>` : ''}
          </div>`;
        });
      }
      else if (data.actions){
        let actions = data.actions;
        html = createSafetyActionsHtml(actions);
        html += `</div>`;
      }
      
      $("#detailsDiv").html(html);
    });
    </script>
    <script>
    //create an on focus event and onfocus call fetchReport Function
    document.onreadystatechange = function () {
      var state = document.readyState
      if (state == 'complete') {
        setTimeout(function () {
          document.getElementById('interactive');
          document.getElementById('load').style.visibility = "hidden";
        }, 1000);
      }
    }
  </script>
  <script src="../../Components/bottomNav/bottomNav.js"></script>
</body>

</html>
