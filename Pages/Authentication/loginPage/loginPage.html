<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Usafe — Safety Compliance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js" integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g=" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/b576bd8d3c.js" crossorigin="anonymous"></script>
    <script src="../../../Global/URLS.js"></script>
    <script src="../../../Helpers/HttpHandler.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.all.min.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../../css/usafe-swal.css">
    <link rel="stylesheet" href="../../../css/loader.css">
    <style>
        :root {
            --safety-yellow: #f5b700;
            --safety-yellow-dark: #e5a100;
            --safety-yellow-light: #ffd54f;
            --charcoal: #2d2d2d;
            --charcoal-light: #3d3d3d;
            --white: #ffffff;
            --surface: #fafafa;
            --text-dark: #1a1a1a;
            --text-mid: #666666;
            --text-light: #999999;
            --border: #e8e8e8;
            --radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background: var(--white);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* ===== YELLOW HERO ===== */
        .hero {
            background: var(--safety-yellow);
            padding: 40px 24px 60px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Diagonal helmet texture pattern */
        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                repeating-linear-gradient(
                    -45deg,
                    transparent,
                    transparent 30px,
                    rgba(0,0,0,0.02) 30px,
                    rgba(0,0,0,0.02) 31px
                );
            pointer-events: none;
        }

        /* Curved bottom edge */
        .hero::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 32px;
            background: var(--white);
            border-radius: 32px 32px 0 0;
        }

        .hero-inner {
            position: relative;
            z-index: 2;
        }

        .logo-img {
            width: 100px;
            height: 100px;
            border-radius: 24px;
            object-fit: cover;
            margin-bottom: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }

        .hero h1 {
            font-size: 14px;
            font-weight: 700;
            color: var(--charcoal);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* ===== FORM ===== */
        .form-wrap {
            padding: 8px 24px 24px;
            flex: 1;
        }

        .form-greeting {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .form-subtext {
            font-size: 14px;
            color: var(--text-mid);
            margin-bottom: 28px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .field-input-wrap {
            position: relative;
        }

        .field-input-wrap input {
            width: 100%;
            height: 52px;
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 0 48px 0 16px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-dark);
            background: var(--white);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            -webkit-appearance: none;
        }

        .field-input-wrap input::placeholder {
            color: var(--text-light);
            font-weight: 400;
        }

        .field-input-wrap input:focus {
            border-color: var(--safety-yellow);
            box-shadow: 0 0 0 4px rgba(245, 183, 0, 0.15);
        }

        .field-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 15px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .field-icon:hover { color: var(--safety-yellow-dark); }

        .forgot-row {
            text-align: right;
            margin-bottom: 24px;
            margin-top: -8px;
        }

        .forgot-row a {
            font-size: 13px;
            color: var(--safety-yellow-dark);
            text-decoration: none;
            font-weight: 700;
        }

        /* ===== LOGIN BUTTON ===== */
        .btn-login {
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 14px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.12s, box-shadow 0.2s;
            background: var(--charcoal);
            color: var(--safety-yellow);
            letter-spacing: 0.5px;
            box-shadow: 0 4px 16px rgba(45, 45, 45, 0.25);
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(45, 45, 45, 0.35);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Yellow accent bar on button */
        .btn-login::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20%;
            right: 20%;
            height: 3px;
            background: var(--safety-yellow);
            border-radius: 3px 3px 0 0;
        }

        /* ===== LANGUAGE TOGGLE ===== */
        .lang-section {
            margin-top: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .lang-label {
            font-size: 12px;
            color: var(--text-light);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .lang-toggle {
            display: flex;
            background: var(--surface);
            border-radius: 10px;
            overflow: hidden;
        }

        .lang-opt {
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-light);
            cursor: pointer;
            border: none;
            background: transparent;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: all 0.2s;
        }

        .lang-opt.active {
            background: var(--charcoal);
            color: var(--safety-yellow);
            border-radius: 8px;
        }

        /* ===== FOOTER ===== */
        .footer {
            padding: 20px;
            text-align: center;
        }

        .footer p {
            font-size: 11px;
            color: var(--text-light);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .footer span {
            font-weight: 800;
            color: var(--safety-yellow-dark);
        }

        /* ===== URDU ===== */
        .urdu-text { display: none; }
        .english-text { display: inline; }
        #load { display: none; }
        #languageSelect { display: none; }

        @media (min-width: 480px) {
            .form-wrap { max-width: 420px; margin: 0 auto; }
        }
    </style>
</head>
<body>
    <span id="load"></span>

    <div class="hero">
        <div class="hero-inner">
            <img class="logo-img" src="../../../assets/usafeLogo.png" alt="Usafe" />
            <h1>Safety Compliance</h1>
        </div>
    </div>

    <div class="form-wrap">
        <p class="form-greeting">Welcome back</p>
        <p class="form-subtext">
            <span class="english-text">Sign in to continue your safety inspections</span>
            <span class="urdu-text" lang="ur">اپنے حفاظتی معائنے جاری رکھنے کے لیے سائن ان کریں</span>
        </p>

        <div class="field">
            <label class="field-label">
                <span class="english-text">Email</span>
                <span class="urdu-text" lang="ur">ای میل</span>
            </label>
            <div class="field-input-wrap">
                <input id="username" type="text" placeholder="name@agency.com" autocomplete="email" />
                <i class="fa fa-user field-icon" style="pointer-events:none"></i>
            </div>
        </div>

        <div class="field">
            <label class="field-label">
                <span class="english-text">Password</span>
                <span class="urdu-text" lang="ur">پاس ورڈ</span>
            </label>
            <div class="field-input-wrap">
                <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" />
                <i class="fa fa-eye field-icon passCheck" onclick="showPassword()"></i>
            </div>
        </div>

        <div class="forgot-row">
            <a href="https://usafe.innidata.com/Identity/Account/ForgotPassword">
                <span class="english-text">Forgot password?</span>
                <span class="urdu-text" lang="ur">پاسورڈ بھول گے؟</span>
            </a>
        </div>

        <button type="button" class="btn-login btnLogin" onclick="Login()">
            <span class="english-text">Sign In</span>
            <span class="urdu-text" lang="ur">لاگ ان</span>
        </button>

        <div class="lang-section">
            <span class="lang-label">Language</span>
            <div class="lang-toggle">
                <button class="lang-opt active" data-lang="en" onclick="setLang('en')">EN</button>
                <button class="lang-opt" data-lang="ur" onclick="setLang('ur')">اردو</button>
            </div>
        </div>

        <select id="languageSelect" onchange="changePlaceholder()">
            <option value="en">English</option>
            <option value="ur">Urdu</option>
        </select>
    </div>

    <div class="footer">
        <p>Powered by <span>Innidata</span></p>
    </div>

    <script src="../../../Js/Authentication/Login.js"></script>
    <script src="../../../Js/LanguageSelection.js"></script>
    <script>
        function showPassword() {
            var x = document.getElementById("password");
            if (x.type === "password") {
                x.type = "text";
                $(".passCheck").removeClass("fa-eye").addClass("fa-eye-slash");
            } else {
                x.type = "password";
                $(".passCheck").removeClass("fa-eye-slash").addClass("fa-eye");
            }
        }

        function setLang(lang) {
            document.querySelectorAll('.lang-opt').forEach(b => b.classList.remove('active'));
            document.querySelector(`.lang-opt[data-lang="${lang}"]`).classList.add('active');
            document.getElementById('languageSelect').value = lang;
            if (typeof changePlaceholder === 'function') changePlaceholder();
            if (lang === 'ur') {
                document.querySelectorAll('.english-text').forEach(el => el.style.display = 'none');
                document.querySelectorAll('.urdu-text').forEach(el => el.style.display = 'inline');
            } else {
                document.querySelectorAll('.english-text').forEach(el => el.style.display = 'inline');
                document.querySelectorAll('.urdu-text').forEach(el => el.style.display = 'none');
            }
        }
    </script>
</body>
</html>
