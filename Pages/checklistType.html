<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DCA Checklist</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/b576bd8d3c.js" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js" integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g=" crossorigin="anonymous"></script>

    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.all.min.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/usafe-swal.css">

    <!-- App CSS -->
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/usafe-global.css">
    <link rel="stylesheet" href="../css/usafe-app.css">

    <!-- App JS -->
    <script src="../Templates/Header.js"></script>
    <script src="../Helpers/LocalStorage.js"></script>
    <script src="../Templates/ReportingType.js"></script>
    <script src="../Js/Authentication/CheckUser.js"></script>
    <script src="../Global/URLS.js"></script>
    <script src="../Helpers/HttpHandler.js"></script>
    <script src="../Js/DcaChecklistType.js"></script>

    <style>
        /* ===== PAGE-SPECIFIC: Checklist Type Selection ===== */

        #header { display: none; }

        .page-container {
            padding: 20px 16px;
            max-width: 480px;
            margin: 0 auto;
        }

        .page-subtitle {
            font-size: 14px;
            font-weight: 500;
            color: #888;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Card overrides for #dcaChecklistType */
        #dcaChecklistType .card {
            background: var(--white);
            border: none;
            border-radius: var(--radius);
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 14px;
            overflow: hidden;
            position: relative;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        #dcaChecklistType .card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 5px;
            background: var(--safety-yellow);
            border-radius: 16px 0 0 16px;
        }

        #dcaChecklistType .card:active { transform: scale(0.98); box-shadow: 0 1px 6px rgba(0,0,0,0.08); }
        #dcaChecklistType .card-body { padding: 0 !important; }
        #dcaChecklistType .card .row { margin: 0; }
        #dcaChecklistType .card .btn-link { color: var(--charcoal); text-decoration: none; width: 100%; padding: 0; }
        #dcaChecklistType .card .btn-link:hover, #dcaChecklistType .card .btn-link:focus { text-decoration: none; color: var(--charcoal); }
        #dcaChecklistType .card .btn-link > div { padding: 18px 20px 18px 24px !important; }
        #dcaChecklistType .card .card-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 600; color: var(--charcoal); margin: 0; line-height: 1.4; }
        #dcaChecklistType .card .fa-chevron-circle-right { color: var(--safety-yellow); font-size: 20px; }

        #dcaChecklistType .text-muted { font-family: 'Plus Jakarta Sans', sans-serif; color: #aaa !important; font-size: 15px; }
    </style>
</head>
<body>
    <!-- Old header (hidden, kept for JS compatibility) -->
    <div id="header"></div>

    <!-- New Top Bar -->
    <div class="usafe-topbar">
        <div class="topbar-back" onclick="window.history.back()">
            <i class="fas fa-arrow-left"></i>
        </div>
        <img src="../assets/usafeLogo.png" alt="USafe">
        <h1 class="topbar-title">Checklists</h1>
    </div>

    <!-- Page Content -->
    <div class="page-container usafe-page-content">
        <div class="page-subtitle">Select checklist</div>
        <div id="dcaChecklistType"></div>
    </div>

    <script src="../Components/bottomNav/bottomNav.js"></script>

    <script src="../Js/HeaderTitle.js"></script>
</body>
</html>
