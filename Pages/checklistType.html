<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DCA Checklist</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/b576bd8d3c.js" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js" integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g=" crossorigin="anonymous"></script>

    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.all.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/usafe-swal.css">

    <!-- App CSS -->
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/usafe-global.css">

    <!-- App JS -->
    <script src="../Templates/Header.js"></script>
    <script src="../Helpers/LocalStorage.js"></script>
    <script src="../Templates/ReportingType.js"></script>
    <script src="../Js/Authentication/CheckUser.js"></script>
    <script src="../Global/URLS.js"></script>
    <script src="../Helpers/HttpHandler.js"></script>
    <script src="../Js/DcaChecklistType.js"></script>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #fafafa;
            margin: 0;
            padding: 0;
            padding-top: 48px;
            padding-bottom: 80px;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Top Bar ── */
        .usafe-topbar {
            background-color: #f5b700;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .usafe-topbar img {
            width: 32px;
            height: 32px;
            border-radius: 6px;
        }

        .usafe-topbar .topbar-title {
            font-size: 18px;
            font-weight: 700;
            color: #2d2d2d;
            margin: 0;
        }

        .usafe-topbar .topbar-back {
            color: #2d2d2d;
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
        }

        .usafe-topbar .topbar-back:hover {
            background: rgba(0,0,0,0.08);
        }

        /* ── Hide the old header ── */
        #header {
            display: none;
        }

        /* ── Page Content ── */
        .page-container {
            padding: 20px 16px;
            max-width: 480px;
            margin: 0 auto;
        }

        .page-subtitle {
            font-size: 14px;
            font-weight: 500;
            color: #888;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ── Card Styles (override cards generated by createReportingTypeTemplate) ── */
        #dcaChecklistType .card {
            background: #ffffff;
            border: none;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 14px;
            overflow: hidden;
            position: relative;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        #dcaChecklistType .card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            background: #f5b700;
            border-radius: 16px 0 0 16px;
        }

        #dcaChecklistType .card:active {
            transform: scale(0.98);
            box-shadow: 0 1px 6px rgba(0,0,0,0.08);
        }

        #dcaChecklistType .card-body {
            padding: 0 !important;
        }

        #dcaChecklistType .card .row {
            margin: 0;
        }

        #dcaChecklistType .card .btn-link {
            color: #2d2d2d;
            text-decoration: none;
            width: 100%;
            padding: 0;
        }

        #dcaChecklistType .card .btn-link:hover,
        #dcaChecklistType .card .btn-link:focus {
            text-decoration: none;
            color: #2d2d2d;
        }

        #dcaChecklistType .card .btn-link > div {
            padding: 18px 20px 18px 24px !important;
        }

        #dcaChecklistType .card .card-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: #2d2d2d;
            margin: 0;
            line-height: 1.4;
        }

        #dcaChecklistType .card .fa-chevron-circle-right {
            color: #f5b700;
            font-size: 20px;
        }

        /* ── Empty state ── */
        #dcaChecklistType .text-muted {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #aaa !important;
            font-size: 15px;
        }

        /* ── Bottom Nav ── */
        .usafe-bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
            box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
            z-index: 100;
        }

        .nav-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #aaa;
            font-size: 11px;
            font-weight: 500;
            gap: 3px;
            padding: 4px 12px;
            border-radius: 12px;
            transition: color 0.2s;
        }

        .nav-tab i {
            font-size: 20px;
        }

        .nav-tab.active {
            color: #f5b700;
        }

        .nav-tab:hover {
            text-decoration: none;
            color: #f5b700;
        }
    </style>
</head>
<body>
    <!-- Old header (hidden, kept for JS compatibility) -->
    <div id="header"></div>

    <!-- New Top Bar -->
    <div class="usafe-topbar">
        <div class="topbar-back" onclick="window.history.back()">
            <i class="fas fa-arrow-left"></i>
        </div>
        <img src="../assets/usafeLogo.png" alt="USafe">
        <h1 class="topbar-title">Checklists</h1>
    </div>

    <!-- Page Content -->
    <div class="page-container">
        <div class="page-subtitle">Select checklist</div>
        <div id="dcaChecklistType"></div>
    </div>

    <script src="../Components/bottomNav/bottomNav.js"></script>

    <script src="../Js/HeaderTitle.js"></script>
</body>
</html>
