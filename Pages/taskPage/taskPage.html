<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">

        integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
        crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/b576bd8d3c.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="../../css/reportDetails.css">

    <link rel="stylesheet" href="../../css/usafe-skeleton.css">

    <script src="../../Js/Authentication/CheckUser.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.all.min.js"></script>

    <link rel="stylesheet" href="../../css/usafe-toast.css">
    <link rel="stylesheet" href="../../css/usafe-swal.css">
    <style>
        /* ===== PAGE-SPECIFIC: Task Page ===== */

        /* Header */
        .task-page-header {
            background: var(--safety-yellow);
            padding: 0 20px;
            font-weight: 800;
            font-size: 22px;
            color: var(--charcoal);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
            height: 64px;
            display: flex;
            align-items: center;
            letter-spacing: -0.3px;
        }

        .task-page-header::after {
            content: '';
            position: absolute;
            bottom: -16px;
            left: 0;
            right: 0;
            height: 16px;
            background: var(--surface);
            border-radius: 16px 16px 0 0;
        }

        #header { display: none; }

        /* ===== TASK CARDS ===== */
        .TaskContentContainer {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: 100%;
            margin-top: 80px;
            margin-bottom: 100px;
            padding: 0 16px;
        }

        .TaskContent { width: 100%; max-width: 500px; }

        .TaskContainer {
            background: var(--white) !important;
            border: none !important;
            border-radius: var(--radius) !important;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 12px;
            overflow: hidden;
            height: auto !important;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .TaskContainer .ReportContent { display: flex; padding: 16px; gap: 8px; }
        .TaskHeadings { width: auto !important; min-width: 90px; margin-left: 0 !important; }
        .TaskHeadings p, .ReportDescriptions p { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; margin: 0; padding: 3px 0 !important; line-height: 1.4; }
        .TaskHeadings p { font-weight: 700; color: var(--text-mid); }
        .ReportDescriptions p { font-weight: 600; color: var(--text-dark); }
        .ReportBorder { height: 1px !important; background: var(--border) !important; width: 92% !important; margin: 0 auto; }

        .TaskBtn { display: flex; gap: 0; }
        .TaskBtn .ReportButton { flex: 1; background: var(--white) !important; border: none !important; padding: 14px 8px !important; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: var(--charcoal); cursor: pointer; transition: background 0.2s, color 0.2s; margin: 0 !important; width: 50% !important; }
        .TaskBtn .ReportButton:first-child { color: var(--safety-yellow-dark); border-right: 1px solid var(--border) !important; }
        .TaskBtn .ReportButton:last-child { background: var(--charcoal) !important; color: var(--safety-yellow) !important; }
        .TaskBtn .ReportButton:active { opacity: 0.8; }

        /* ===== MODAL ===== */
        .modal-content { border: none; border-radius: 20px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
        .modal-header { background: var(--safety-yellow); border-bottom: none; padding: 20px 24px; }
        .modal-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 18px; color: var(--charcoal); }
        .modal-header .close { color: var(--charcoal); opacity: 0.6; font-size: 24px; }
        .modal-body { padding: 24px; font-family: 'Plus Jakarta Sans', sans-serif; }
        .modal-body input[type="radio"] { accent-color: var(--safety-yellow); width: 18px; height: 18px; margin-right: 8px; vertical-align: middle; }
        .modal-body label { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 600; color: var(--text-dark); vertical-align: middle; }
        .modal-footer { border-top: 1px solid var(--border); padding: 16px 24px; gap: 8px; }
        .modal-footer .btn-danger { background: var(--surface) !important; color: var(--text-mid) !important; border: none !important; border-radius: 12px !important; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 14px; padding: 10px 24px; }
        .modal-footer .btn-primary { background: var(--charcoal) !important; color: var(--safety-yellow) !important; border: none !important; border-radius: 12px !important; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 14px; padding: 10px 24px; box-shadow: 0 4px 12px rgba(45,45,45,0.2); }
    </style>
</head>

<body>
    <div id="load"></div>

    <div class="task-page-header">My Tasks</div>

    <div id="header"></div>

    <div class='TaskContentContainer usafe-page-content'>
        <div class='TaskContent'>
            <div class="tasks"></div>
        </div>
    </div>

    <a href="/Pages/reportingType.html" class="float">
        <i class="fa fa-plus my-float"></i>
    </a>

    <div class="taskBar"></div>

    <div class="modal fade" id="taskModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
        aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Change Task Status</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>

                <div class="modal-body" id="changeStatusModalBody">
                    <div>

                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="modalBtn btn btn-danger" data-dismiss="modal">Cancel</button>
                    <button type="button" class="modalBtn btn btn-primary" onclick="changeTaskStatus()">Change</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../../Js/HeaderTitle.js"></script>
    <script src="../../Components/tasks/index.js"></script>
    <script src="../../Components/floatBtn/index.js"></script>
    <script src="../../Components/reportCount/repCount.js"></script>
    <script src="../../Components/taskBar/index.js"></script>
    <script src="../../Components/bottomNav/bottomNav.js"></script>

    <script src="../../Global/URLS.js"></script>
    <script src="../../Helpers/HttpHandler.js"></script>
    <script src="../../Helpers/Toast.js"></script>
    <script src="../../Js/myTasks.js"></script>
    <script>
        //create an on focus event and onfocus call fetchReport Function
        document.onreadystatechange = function () {
          var state = document.readyState
          if (state == 'complete') {
            setTimeout(function () {
              document.getElementById('interactive');
              document.getElementById('load').style.visibility = "hidden";
            }, 1000);
          }
        }
      </script>
</body>

</html>
