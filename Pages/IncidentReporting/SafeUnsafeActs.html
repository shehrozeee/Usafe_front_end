    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background-color: #fafafa;
            margin: 0;
            padding: 0;
            padding-top: 48px;
            padding-bottom: 100px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        /* ── Labels ── */
        .form-group label {
            font-size: 13px;
            font-weight: 700;
            color: #888;
            margin-bottom: 6px;
        }

        /* ── Inputs & Selects ── */
        .form-control {
            border-radius: 10px;
            border: 1.5px solid #e4e4e4;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            padding: 10px 14px;
            color: #2d2d2d;
            background: #ffffff;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: #f5b700;
            box-shadow: 0 0 0 3px rgba(245, 183, 0, 0.12);
            outline: none;
        }

        .form-control:read-only {
            background: #f5f5f5;
            color: #999;
        }

        /* ── Textarea ── */
        textarea.form-control {
            min-height: 80px;
            resize: vertical;
        }

        /* ── Upload & Camera Buttons ── */
        .btn-upload-file,
        .btn-take-photo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #2d2d2d;
            color: #f5b700;
            border: none;
            border-radius: 10px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            font-size: 14px;
            padding: 10px 16px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-decoration: none;
            flex: 1;
            justify-content: center;
        }

        .btn-upload-file:hover,
        .btn-upload-file:active,
        .btn-take-photo:hover,
        .btn-take-photo:active {
            background-color: #3d3d3d;
            color: #f5b700;
            text-decoration: none;
        }

        /* ── Submit Button ── */
        .btn-secondary.btn-block {
            background-color: #2d2d2d;
            color: #f5b700;
            border: none;
            border-radius: 12px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 15px;
            padding: 14px;
            width: 100%;
            margin-top: 20px;
            transition: opacity 0.2s;
        }

        .btn-secondary.btn-block:hover,
        .btn-secondary.btn-block:focus,
        .btn-secondary.btn-block:active {
            background-color: #3d3d3d;
            color: #f5b700;
            box-shadow: none;
        }

        /* ── Radio Buttons ── */
        input[type="radio"] {
            accent-color: #f5b700;
            margin-right: 4px;
        }
    </style>
