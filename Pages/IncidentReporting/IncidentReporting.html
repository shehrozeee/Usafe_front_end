    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background-color: #fafafa;
            margin: 0;
            padding: 0;
            padding-top: 48px;
            padding-bottom: 100px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        /* ── Labels ── */
        .form-group label {
            font-size: 13px;
            font-weight: 700;
            color: #888;
            margin-bottom: 6px;
        }

        /* ── Inputs & Selects ── */
        .form-control {
            border-radius: 10px;
            border: 1.5px solid #e4e4e4;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            padding: 10px 14px;
            color: #2d2d2d;
            background: #ffffff;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: #f5b700;
            box-shadow: 0 0 0 3px rgba(245, 183, 0, 0.12);
            outline: none;
        }

        .form-control:read-only {
            background: #f5f5f5;
            color: #999;
        }

        /* ── Textarea ── */
        textarea.form-control {
            min-height: 80px;
            resize: vertical;
        }

        /* ── Upload & Camera Buttons ── */
        .btn-upload-file,
        .btn-take-photo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #2d2d2d;
            color: #f5b700;
            border: none;
            border-radius: 10px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            font-size: 14px;
            padding: 10px 16px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-decoration: none;
            flex: 1;
            justify-content: center;
        }

        .btn-upload-file:hover,
        .btn-upload-file:active,
        .btn-take-photo:hover,
        .btn-take-photo:active {
            background-color: #3d3d3d;
            color: #f5b700;
            text-decoration: none;
        }

        /* ── Submit Button ── */
        .btn-secondary.btn-block {
            background-color: #2d2d2d;
            color: #f5b700;
            border: none;
            border-radius: 12px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 15px;
            padding: 14px;
            width: 100%;
            margin-top: 20px;
            transition: opacity 0.2s;
        }

        .btn-secondary.btn-block:hover,
        .btn-secondary.btn-block:focus,
        .btn-secondary.btn-block:active {
            background-color: #3d3d3d;
            color: #f5b700;
            box-shadow: none;
        }

        /* ── Radio Buttons ── */
        input[type="radio"] {
            accent-color: #f5b700;
            margin-right: 4px;
        }
    </style>

    <div id="header"></div>
    <div class="container">
        <form id="incidentReporting">

            <div id="initialCommonFields"></div>
            <div class="form-group">

                <textarea class="form-control" placeholder="Action" id="Action" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label for="actType"><span class="english-text">Event Type</span><span id="ureventType" lang="ur" class="urdu-text">واقعہ کی قسم</span></label>
                <select class="form-control" id="EventType" rows="3">

                  <option selected disabled hidden class="english-text">Select Event Type</option>
                  <option value="Environmental" lang="en" class="english-text">Environmental</option>
                  <option value="Minor Injuries" lang="en" class="english-text">Minor Injuries</option>
                  <option value="Near Miss (Type A)" lang="en" class="english-text">Near Miss (Type A)</option>
                  <option value="Near Miss (Type B)" lang="en" class="english-text">Near Miss (Type B)</option>
                  <option value="Near Miss (Type C)" lang="en" class="english-text">Near Miss (Type C)</option>
                  <option value="Illness" lang="en" class="english-text">Illness</option>
                  <option value="Injury" lang="en" class="english-text">Injury</option>
                  <option value="Property Damage" lang="en" class="english-text">Property Damage</option>
                  <option value="ماحولیاتی" lang="ur" class="urdu-text">ماحولیاتی</option>
                  <option value="معمولی زخم" lang="ur" class="urdu-text">معمولی زخم</option>
                  <option value="قریبی گزر (قسم اے)" lang="ur" class="urdu-text">قریبی گزر (قسم اے)</option>
                  <option value="قریبی گزر (قسم بی)" lang="ur" class="urdu-text">قریبی گزر (قسم بی)</option>
                  <option value="قریبی گزر (قسم سی)" lang="ur" class="urdu-text">قریبی گزر (قسم سی)</option>
                  <option value="بیماری" lang="ur" class="urdu-text">بیماری</option>
                  <option value="چوٹ" lang="ur" class="urdu-text">چوٹ</option>
                  <option value="جائیداد کا نقصان" lang="ur" class="urdu-text">جائیداد کا نقصان</option>
                </select>
            </div>

            <div class="form-group">
                <label for="actSubType">
                  <span id="eneventType" lang="en" class="english-text">Event Sub Type</span>
                  <span id="ureventSubType" lang="ur" class="urdu-text"> واقعہ کی ذیلی قسم</span>
                </label>
                <select class="form-control" id="EventSubType" rows="3">

                  <option selected disabled hidden class="english-text">Select Event Sub Type</option>
                  <option value="Potential Injuries" lang="en" class="english-text">Potential Injuries</option>
                  <option value="Potential Environment" lang="en" class="english-text">Potential Environment</option>
                  <option value="Potential Property Damage" lang="en" class="english-text">Potential Property Damage</option>
                  <option value="ممکنہ چوٹیں" lang="ur" class="urdu-text">ممکنہ چوٹیں</option>
                  <option value="ممکنہ ماحول" lang="ur" class="urdu-text">ممکنہ ماحول</option>
                  <option value="املاک کو ممکنہ نقصان" lang="ur" class="urdu-text">املاک کو ممکنہ نقصان</option>
                </select>
            </div>

            <div class="form-group">
                <label for="actType"><span id="eneventType" lang="en" class="english-text">Reason</span><span id="ureventType" lang="ur" class="urdu-text">وجہ</span></label>
                <select class="form-control dust" id="ActTyp" rows="3"> <!-- changed id from Reason to ActType -->

                    <!-- <option>Safe Travel<span id="ureventType" lang="ur">واقعہ کی قسم</span></option>
                    <option>Manual Trolly<span id="ureventType" lang="ur">واقعہ کی قسم</span></option>
                    <option>Ergonomics<span id="ureventType" lang="ur">واقعہ کی قسم</span></option> -->

                    <option selected disabled hidden class="english-text"><span id="eneventType" lang="en">Select Reason</span></option>
                    <option value="Safe Travel" class="english-text">Safe Travel</option>
                    <option value="Manual Trolly" class="english-text">Manual Trolly</option>
                    <option value="Ergonomics" class="english-text">Ergonomics</option>
                    <option value="Other" class="english-text">Other (write your own)</option>
                    <option class="urdu-text" lang="ur">وجہ</option>
                    <option value="محفوظ سفر" class="urdu-text">محفوظ سفر</option>
                    <option value="دستی ٹرالی" class="urdu-text">دستی ٹرالی</option>
                    <option value="فعالیات پیمائی" class="urdu-text">فعالیات پیمائی</option>
                    <option value="Other" class="urdu-text">دیگر (اپنی وجہ لکھیں)</option>
                </select>
            </div>

            <!-- Free-text reason, shown only when "Other" is selected. No id/name so the
                 generic getFormValues() collector ignores it; the typed value is mirrored
                 into the selected #ActTyp option so it submits through the existing field. -->
            <div class="form-group" id="otherReasonGroup" style="display:none;">
                <label>
                    <span class="english-text">Please write your reason</span>
                    <span class="urdu-text" lang="ur">براہ کرم اپنی وجہ لکھیں</span>

            </div>
            <div class="form-group">
                <label>

                    <span class="urdu-text" lang="ur">کوئی شخص ملوث ہے</span>
                  </label>
                  <br>
                  <input id="" checked name="personInvolvement" value="Yes" type="radio" />
                  <label>

                 carries data-imgfield so the shared collector submits it under that category;
                 the default single "Photo" uploader (injected below) is hidden for this form. -->

            </div>
            <div class="form-group">
                <label for="ImgHow"><span class="english-text">How it happened</span><span class="urdu-text" lang="ur">کیسے ہوا</span></label>
                <input type="file" class="form-control" id="ImgHow" data-imgfield="howImages" accept="image/*" multiple />
            </div>
            <div class="form-group">
                <label for="ImgWhy"><span class="english-text">Why it happened</span><span class="urdu-text" lang="ur">کیوں ہوا</span></label>
                <input type="file" class="form-control" id="ImgWhy" data-imgfield="whyImages" accept="image/*" multiple />
            </div>

            <div id="terminalCommonFields"></div>
            <!-- <button class="btn btn-secondary btn-block" type="button" onclick="getFormValues('incidentReporting','api/changeform/savechangeformdata')">Submit<span id="ursubmit" lang="ur">جمع کرائیں
            </span></button> -->
            <button class="btn btn-secondary btn-block" type="button" onclick="submitIncident(this)">
                <span class="english-text">Submit</span>
                <span class="urdu-text" lang="ur">جمع کرائیں</span>
              </button>
        </form>

    <script>
      // This form uses categorized Where/How/Why photo inputs, so hide the default single
      // "Photo" uploader that the shared terminal-common-fields injects (async).
      (function () {
        function hideDefaultPhoto() {
          var p = document.getElementById('Photo');
          if (!p) return false;
          // the template wraps the input in .row on older layouts and .form-group after
          // the UI redesign — hide whichever container this build actually rendered
          var box = p.closest('.row') || p.closest('.form-group');
          if (box) box.style.display = 'none';
          var st = document.getElementById('status');
          if (st) st.style.display = 'none';
          return true;
        }
        if (!hideDefaultPhoto()) {
          var tries = 0;
          var iv = setInterval(function () {
            if (hideDefaultPhoto() || ++tries > 20) clearInterval(iv);
          }, 300);
        }
      })();

      var INCIDENT_PHOTO_SLOTS = [
        { id: 'ImgWhere', label: 'Where it happened' },
        { id: 'ImgHow', label: 'How it happened' },
        { id: 'ImgWhy', label: 'Why it happened' }
      ];

      function emptyIncidentPhotoSlots() {
        return INCIDENT_PHOTO_SLOTS.filter(function (slot) {
          var el = document.getElementById(slot.id);
          return !el || !el.files || el.files.length === 0;
        });
      }

      // Each category needs at least one photo; more are welcome. Then submit as usual.
      function submitIncident(btn) {
        var missing = emptyIncidentPhotoSlots();
        if (missing.length) {
          swalNotification(
            'Please add at least one photo for: ' +
              missing.map(function (s) { return s.label; }).join(', ') + '.',
            'warning'
          );
          return;
        }
        getFormValues('incidentReporting', 'api/changeform/savechangeformdata', btn);
      }
    </script>
    <script>
      // "Other" reason: reveal a free-text box and mirror what the user types into the
      // selected #ActTyp option, so the custom reason submits through the existing field
      // without touching the generic form collector or the backend.
      (function () {
        var reasonSelect = document.getElementById('ActTyp');
        var otherGroup = document.getElementById('otherReasonGroup');
        var otherInput = otherGroup ? otherGroup.querySelector('.js-other-reason') : null;
        if (!reasonSelect || !otherGroup || !otherInput) return;

        function isOtherSelected() {
          var opt = reasonSelect.options[reasonSelect.selectedIndex];
          // the option keeps its original text ("Other ...") even after we overwrite its value
          return !!opt && /^Other|^دیگر/.test(opt.text.trim());
        }

        function syncOtherValue() {
          var opt = reasonSelect.options[reasonSelect.selectedIndex];
          if (!opt) return;
          // fall back to "Other" so the field is never empty (avoids a false validation error)
          opt.value = otherInput.value.trim() || 'Other';
        }

        reasonSelect.addEventListener('change', function () {
          if (isOtherSelected()) {
            otherGroup.style.display = 'block';
            syncOtherValue();
            otherInput.focus();
          } else {
            otherGroup.style.display = 'none';
            otherInput.value = '';
          }
        });

        otherInput.addEventListener('input', syncOtherValue);
      })();
    </script>
    <script>
      //create an on focus event and onfocus call fetchReport Function
      document.onreadystatechange = function () {
          var state = document.readyState
          if (state == 'complete') {
              setTimeout(function () {
                  document.getElementById('interactive');
                  document.getElementById('load').style.visibility = "hidden";
              }, 1000);
          }
      }
  </script>
