    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background-color: #fafafa;
            margin: 0;
            padding: 0;
            padding-bottom: 100px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        /* ── Labels ── */
        .form-group label {
            font-size: 13px;
            font-weight: 700;
            color: #888;
            margin-bottom: 6px;
        }

        /* ── Inputs & Selects ── */
        .form-control {
            border-radius: 10px;
            border: 1.5px solid #e4e4e4;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            padding: 10px 14px;
            color: #2d2d2d;
            background: #ffffff;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: #f5b700;
            box-shadow: 0 0 0 3px rgba(245, 183, 0, 0.12);
            outline: none;
        }

        .form-control:read-only {
            background: #f5f5f5;
            color: #999;
        }

        /* ── Textarea ── */
        textarea.form-control {
            min-height: 80px;
            resize: vertical;
        }

        /* ── File Input ── */
        input[type="file"] {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13px;
            color: #666;
            padding: 10px;
            border: 1.5px dashed #e4e4e4;
            border-radius: 10px;
            background: #ffffff;
            width: 100%;
            cursor: pointer;
        }

        input[type="file"]:focus {
            border-color: #f5b700;
            outline: none;
        }

        /* ── Open Camera Button ── */
        .btn-info,
        button[onclick*="openCamera"],
        .open-camera-btn {
            background-color: #2d2d2d !important;
            color: #f5b700 !important;
            border: none !important;
            border-radius: 10px !important;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            font-size: 14px;
            padding: 10px 16px;
            transition: opacity 0.2s;
        }

        .btn-info:hover,
        .btn-info:focus,
        .btn-info:active,
        button[onclick*="openCamera"]:hover,
        button[onclick*="openCamera"]:focus {
            background-color: #3d3d3d !important;
            color: #f5b700 !important;
            box-shadow: none !important;
        }

        /* ── Submit Button ── */
        .btn-secondary.btn-block {
            background-color: #2d2d2d;
            color: #f5b700;
            border: none;
            border-radius: 12px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 15px;
            padding: 14px;
            width: 100%;
            margin-top: 20px;
            transition: opacity 0.2s;
        }

        .btn-secondary.btn-block:hover,
        .btn-secondary.btn-block:focus,
        .btn-secondary.btn-block:active {
            background-color: #3d3d3d;
            color: #f5b700;
            box-shadow: none;
        }

        /* ── Radio Buttons ── */
        input[type="radio"] {
            accent-color: #f5b700;
            margin-right: 4px;
        }
    </style>
</head>

<body>
    <span id="load"></span>
    <div id="header"></div>
    <div class="container">
        <form id="hazardReporting">

            <div id="initialCommonFields"></div>

            <div id="terminalCommonFields"></div>
            <!-- <button class="btn btn-secondary btn-block" type="button" onclick="getFormValues('hazardReporting','api/changeform/savechangeformdata')">Submit<span id="ursubmit" lang="ur">جمع کرائیں
            </span></button> -->
            <button class="btn btn-secondary btn-block" type="button"
                onclick="getFormValues('hazardReporting', 'api/changeform/savechangeformdata',this)">
                <span class="english-text">Submit</span>
                <span class="urdu-text" lang="ur">جمع کرائیں</span>
            </button>
        </form>
    </div>

    <script src="../../Js/HeaderTitle.js"></script>
    <script src="../../Helpers/FormDataHandler.js"></script>
    <script src="../../Js/LanguageSelection.js"></script>
    <script>
        //create an on focus event and onfocus call fetchReport Function
        document.onreadystatechange = function () {
            var state = document.readyState
            if (state == 'complete') {
                setTimeout(function () {
                    document.getElementById('interactive');
                    document.getElementById('load').style.visibility = "hidden";
                }, 1000);
            }
        }
    </script>
    <script src="../../Components/bottomNav/bottomNav.js"></script>
</body>

</html>
