<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Safety Action Meeting</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css">
    <script src="https://kit.fontawesome.com/b576bd8d3c.js" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js" integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.all.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/usafe-swal.css">
    <link rel="stylesheet" href="../../css/header.css">
    <link rel="stylesheet" href="../../css/reportDetails.css">
    <link rel="stylesheet" href="../../css/taskDetails.css">
    <link rel="stylesheet" href="../../css/usafe-forms.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="../../Helpers/Celebrations.js"></script>
    <script src="../../Helpers/Validation.js"></script>

    <script src="../../Templates/Header.js"></script>
    <script src="../../Js/HeaderTitle.js"></script>
    <script src="../../Global/URLS.js"></script>
    <script src="../../Helpers/LocalStorage.js"></script>
    <script src="../../Js/Common/SiteSelector.js"></script>
    <script src="../../Helpers/HttpHandler.js"></script>
    <script src="../../Js/Authentication/CheckUser.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #fafafa;
            color: #2d2d2d;
            margin: 0;
            padding-top: 48px;
        }

        /* ── Layout ── */
        .taskDetailContainer {
            max-width: 500px;
            margin: 0 auto;
            padding: 16px 18px 100px;
        }

        /* ── Section Card ── */
        .sam-card {
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            padding: 18px 16px;
            margin-bottom: 14px;
        }
        .sam-card-title {
            font-size: 14px;
            font-weight: 800;
            color: #2d2d2d;
            margin-bottom: 14px;
            letter-spacing: -0.2px;
        }

        /* ── Labels ── */
        .sam-label {
            font-size: 13px;
            font-weight: 700;
            color: #888;
            margin-bottom: 5px;
            display: block;
        }

        /* ── Inputs & Textareas ── */
        .sam-input,
        .sam-textarea,
        .sam-select {
            width: 100%;
            border-radius: 10px;
            border: 1.5px solid #e4e4e4;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            padding: 10px 12px;
            background: #ffffff;
            color: #2d2d2d;
            transition: border-color 0.2s;
            -webkit-appearance: none;
        }
        .sam-input:focus,
        .sam-textarea:focus,
        .sam-select:focus {
            border-color: #f5b700;
            outline: none;
            box-shadow: 0 0 0 2px rgba(245,183,0,0.12);
        }
        .sam-textarea {
            resize: vertical;
            min-height: 60px;
        }
        .sam-input[readonly] {
            background: #f5f5f5;
            cursor: default;
            color: #666;
        }

        /* ── Field Group ── */
        .sam-field {
            margin-bottom: 12px;
        }
        .sam-field:last-child {
            margin-bottom: 0;
        }

        /* ── Two-column grid ── */
        .sam-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* ── Actions Card Header ── */
        .sam-actions-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sam-actions-header .sam-card-title {
            margin-bottom: 0;
        }
        .sam-add-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: #2d2d2d;
            color: #f5b700;
            border: none;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .sam-add-btn:hover {
            background: #1a1a1a;
        }

        /* ── Actions Table ── */
        .sam-table-wrap {
            margin-top: 14px;
        }
        .sam-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 13px;
        }
        .sam-table thead th {
            background: #2d2d2d;
            color: #f5b700;
            font-weight: 600;
            padding: 10px 12px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .sam-table thead th:first-child { border-radius: 10px 0 0 0; }
        .sam-table thead th:last-child { border-radius: 0 10px 0 0; }
        .sam-table tbody td {
            padding: 10px 12px;
            border-bottom: 1px solid #f0f0f0;
            color: #2d2d2d;
            vertical-align: middle;
        }
        .sam-table tbody tr:last-child td {
            border-bottom: none;
        }
        .sam-table tbody tr:last-child td:first-child { border-radius: 0 0 0 10px; }
        .sam-table tbody tr:last-child td:last-child { border-radius: 0 0 10px 0; }
        .sam-table .sam-action-icons i {
            cursor: pointer;
            margin-left: 10px;
            font-size: 14px;
            color: #888;
            transition: color 0.2s;
        }
        .sam-table .sam-action-icons i:hover {
            color: #2d2d2d;
        }
        .sam-table .sam-action-icons i.fa-trash:hover {
            color: #d9534f;
        }
        .sam-empty-state {
            text-align: center;
            padding: 20px 12px;
            color: #bbb;
            font-size: 13px;
            font-weight: 500;
        }

        /* ── Bottom Buttons ── */
        .sam-bottom-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }
        .sam-btn-guidelines {
            flex: 0 0 auto;
            padding: 14px 20px;
            border-radius: 12px;
            background: #ffffff;
            color: #2d2d2d;
            border: 1.5px solid #e4e4e4;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .sam-btn-guidelines:hover {
            border-color: #f5b700;
            text-decoration: none;
            color: #2d2d2d;
        }
        .sam-btn-submit {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            background: #2d2d2d;
            color: #f5b700;
            border: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .sam-btn-submit:hover {
            background: #1a1a1a;
        }

        /* ── Modal ── */
        .modal-content {
            border: none;
            border-radius: 16px;
            overflow: hidden;
        }
        .sam-modal-header {
            background: #f5b700;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sam-modal-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 16px;
            color: #2d2d2d;
            margin: 0;
        }
        .sam-modal-close {
            background: none;
            border: none;
            font-size: 22px;
            color: #2d2d2d;
            cursor: pointer;
            line-height: 1;
            padding: 0;
            opacity: 0.7;
        }
        .sam-modal-close:hover { opacity: 1; }
        .sam-modal-body {
            padding: 20px;
        }
        .sam-modal-body .sam-field {
            margin-bottom: 14px;
        }
        .sam-modal-footer {
            padding: 0 20px 20px;
        }
        .sam-modal-done-btn {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            background: #2d2d2d;
            color: #f5b700;
            border: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .sam-modal-done-btn:hover {
            background: #1a1a1a;
        }

        /* ── Override bootstrap form-control used in select ── */
        .sam-modal-body .form-control {
            border-radius: 10px;
            border: 1.5px solid #e4e4e4;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            padding: 10px 12px;
        }
        .sam-modal-body .form-control:focus {
            border-color: #f5b700;
            box-shadow: 0 0 0 2px rgba(245,183,0,0.12);
        }

        /* Hide default dropdown classes we no longer use */
        .dropDown { display: none; }
        .DateTimeContainer { display: none; }
        .DetailTextArea { display: none; }
    </style>
</head>

<body>
    <div id="header"></div>

    <div id="initialElementDiv">
    </div>

    <div class="taskDetailContainer">

        <!-- Hidden legacy wrappers (kept for compatibility, hidden via CSS) -->
        <div class="dropDown"></div>
        <div class="dropDown"></div>
        <div class='DateTimeContainer'>
            <div class='reportDetailContainer'>
                <p class='reportDetailContent'>Date</p>
                <input class="taskDate" type="date" id="targetDate" name="targetDate">
            </div>
            <div class='reportDetailContainer'>
                <p class='reportDetailContent'>Time</p>
                <input class="taskDate" type="time" id="targetTime" name="targetTime">
            </div>
        </div>
        <div class='DetailTextArea'>
            <textarea id="leader" name="leader" class='RepText1'></textarea>
        </div>
        <div class='DetailTextArea'>
            <textarea id="Participants" name="Participants" class='RepText'></textarea>
        </div>
        <div class='DetailTextArea'>
            <textarea id="Topic" name="Topic" class='RepText1'></textarea>
        </div>
        <div class='DetailTextArea'>
            <textarea id="facts" name="facts" class='RepText'></textarea>
        </div>

        <!-- ════════════════════════════════════════════ -->
        <!--  VISIBLE REDESIGNED UI                      -->
        <!-- ════════════════════════════════════════════ -->

        <!-- Date & Time Card -->
        <div class="sam-card">
            <div class="sam-card-title">Schedule</div>
            <div class="sam-row">
                <div class="sam-field">
                    <label class="sam-label" for="samDate">Date</label>
                    <input class="sam-input" type="date" id="samDate" name="samDate">
                </div>
                <div class="sam-field">
                    <label class="sam-label" for="samTime">Time</label>
                    <input class="sam-input" type="time" id="samTime" name="samTime">
                </div>
            </div>
        </div>

        <!-- Meeting Details Card -->
        <div class="sam-card">
            <div class="sam-card-title">Meeting Details</div>
            <div class="sam-field">
                <label class="sam-label" for="samLeader">Leader</label>
                <input class="sam-input" type="text" id="samLeader" placeholder="e.g. Ahmed Khan">
            </div>
            <div class="sam-field">
                <label class="sam-label" for="samTopic">Topic</label>
                <input class="sam-input" type="text" id="samTopic" placeholder="Meeting topic">
            </div>
            <div class="sam-field">
                <label class="sam-label" for="samParticipants">Participants</label>
                <textarea class="sam-textarea" id="samParticipants" rows="2" placeholder="Names of participants"></textarea>
            </div>
            <div class="sam-field">
                <label class="sam-label" for="samFacts">Outline of Facts</label>
                <textarea class="sam-textarea" id="samFacts" rows="3" placeholder="Key facts discussed"></textarea>
            </div>
        </div>

        <!-- Actions & Recommendations Card -->
        <div class="sam-card">
            <div class="sam-actions-header">
                <div class="sam-card-title">Actions & Recommendations</div>
                <button class="sam-add-btn" data-target="#VoteModal" data-toggle="modal" title="Add action">
                    <i class="fas fa-plus"></i>
                </button>
            </div>

            <div class="sam-table-wrap">
                <table class="sam-table">
                    <thead>
                        <tr>
                            <th style="width:40px;">#</th>
                            <th>Description</th>
                            <th style="width:70px;text-align:right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
                <div class="sam-empty-state" id="samEmptyState">
                    No actions added yet. Tap <strong>+</strong> to add one.
                </div>
            </div>
        </div>

        <!-- Bottom Buttons -->
        <div class="sam-bottom-actions">
            <a class="sam-btn-guidelines" onclick="navigateToPage('../guidlines/guidlines.html')">
                Guidelines
            </a>
            <button class="sam-btn-submit" onclick="submitData()">Submit</button>
        </div>

    </div>


    <!-- Modal -->
    <div class="modal fade" id="VoteModal" data-backdrop="static" data-keyboard="false" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
        aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="sam-modal-header">
                    <h5 class="sam-modal-title" id="exampleModalLabel">Add Action</h5>
                    <button type="button" class="sam-modal-close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="sam-modal-body">
                    <div class="sam-field">
                        <label class="sam-label">Action / Recommendation</label>
                        <textarea id="Actions" name="Actions" class="sam-textarea" rows="2"
                            placeholder="Describe the action"></textarea>
                    </div>

                    <div class="sam-field">
                        <label class="sam-label">Raised By</label>
                        <input id="RaisedBy" name="RaisedBy" class="sam-input" type="text"
                            placeholder="Who raised this?">
                    </div>

                    <div class="sam-field">
                        <label class="sam-label">Target Date</label>
                        <input class="sam-input" type="date" id="actionDate" name="targetDate">
                    </div>
                </div>
                <div class="sam-modal-footer">
                    <button type="button" class="sam-modal-done-btn" onclick="addAction()">Done</button>
                </div>
            </div>
        </div>
    </div>


</body>
<script>
    var srno = 1;
    var resultArray = [];
    function navigateToPage(url) {
        location.href = url;
    }

    // ── Sync visible fields → hidden original fields ──
    function syncFields() {
        $('#targetDate').val($('#samDate').val());
        $('#targetTime').val($('#samTime').val());
        $('#leader').val($('#samLeader').val());
        $('#Participants').val($('#samParticipants').val());
        $('#Topic').val($('#samTopic').val());
        $('#facts').val($('#samFacts').val());
    }

    // Sync on every input
    $(document).on('input change', '#samDate, #samTime, #samLeader, #samParticipants, #samTopic, #samFacts', syncFields);

    const submitData = ()=>{
        syncFields();
        let department = $('#department').val();
        let area = $('#area').val();
        let leader = $('#leader').val();
        let Participants = $('#Participants').val();
        let Topic = $('#Topic').val();
        let facts = $('#facts').val();
        let targetDate = $('#targetDate').val();
        let targetTime = $('#targetTime').val();
        let siteId = getValue("siteId");
        let userId = getValue("userName");


        let data = {
            "department": department,
            "area": area,
            "leader": leader,
            "Participants": Participants,
            "Topic": Topic,
            "facts": facts,
            "targetDate": targetDate,
            "targetTime": targetTime,
            "siteId": siteId,
            "userId": userId,
            "resultArray": resultArray
        };
        //add validation here to validate if any field is empty. if empty then return and show alert
        if(resultArray.length == 0){
            swalNotification("Please add atleast one action","warning");
            return;
        }
        for (const key in data) {
            if (data.hasOwnProperty(key)) {
                const element = data[key];
                if(element == "" || element == null || element == "0"){
                    swalNotification(`Please provide value for the ${key} field `,"warning");
                    //donot hide the modal

                    return;
                }
            }
        }
        sendRequest(`SafetyActionMeeting/SaveSafetyActionMeeting`, "POST", JSON.stringify(data), (response) => {
            if(response.status == 200){
                swalSuccess("Data Saved Successfully")
            }
            else{
                swalNotification("Data Not Saved", "error");
            }
        });

    }
    const addAction = () => {

        let description = $('#Actions').val();
        let raisedBy = $('#RaisedBy').val();
        let actionDate = $('#actionDate').val();
        let obj = {
            "description": description,
            "raisedBy": raisedBy,
            "responsible": "",
            "targetDate": actionDate,
            srno
        };
        //if any field is empty then return and show alert
        for (const key in obj) {
            if (obj.hasOwnProperty(key)) {
                const element = obj[key];
                if(key === 'responsible') continue;
                if(element == "" || element == null){
                    swalNotification(`Please provide value for the ${key} field `,"warning");
                    return;
                }
            }
        }
        resultArray.push();
        let html = `<tr>
                <td>${srno}</td>
                <td>${description}</td>
                <td class="sam-action-icons" style="text-align:right;">

                    <i class="fas fa-edit" onclick="openEditModal(${srno})"></i>
                    <i class="fas fa-trash" onclick="deleteAction(${srno},this)"></i>
                </td>
            </tr>`
        $('#tableBody').append(html);
        // Hide empty state
        $('#samEmptyState').hide();
        srno++;
        $('#VoteModal').modal('hide');
    }

    //on modal open clear the fields
    $('#VoteModal').on('hide.bs.modal', function (e) {
        $('#Actions').val("");
        $('#RaisedBy').val("");
        $('#targetDate').val("");
    });

    const openEditModal = (srno) => {
        let action = resultArray.find(x => x.srno == srno);
        $('#Actions').val(action.description);
        $('#RaisedBy').text(action.raisedBy);
        $('#targetDate').val(action.targetDate);
        $('#VoteModal').modal('show');

    }

    const deleteAction = (srno,obj) =>{
        let action = resultArray.find(x => x.srno == srno);
        let index = resultArray.indexOf(action);
        resultArray.splice(index,1);
        $(obj).parent().parent().remove();
        // Show empty state if no rows left
        if($('#tableBody tr').length === 0) {
            $('#samEmptyState').show();
        }
    }

    const createInitialElements = () => {
        // Department is the agency — a dropdown when the user has more than one.
        let departmentHtml = isMultiSiteUser()
            ? `<select id="department" class="sam-input">${buildSiteOptions()}</select>`
            : `<input type="text" id="department" class="sam-input" value="${getActiveSiteName()}" readonly>`;

        let wizardHtml = `
    <div class="taskDetailContainer" style="padding-bottom:0;">
    <div class="sam-card">
        <div class="sam-card-title">Location</div>
        <div class="sam-field">
            <label class="sam-label">Department</label>
            ${departmentHtml}
        </div>
        <div class="sam-field">
            <label class="sam-label">Area</label>
            <input type="text" id="area" class="sam-input" placeholder="Enter area...">
        </div>
    </div>
    </div>`;
        $('#initialElementDiv').html(wizardHtml);

        if (isMultiSiteUser()) {
            document.getElementById('department').addEventListener('change', onSiteSelectChange);
        }
    };

    createInitialElements();

    const getAreas = (element) => {
        let siteId = getValue("siteId");
        let departmentId = element.value;
        sendRequest(
            `Area/getArea?siteId=${siteId}&deptId=${departmentId}`,
            "GET",
            null,
            (response) => {
                let areas = response;
                let areaHtml = "<option selected disabled hidden> Select Area </option>";
                areas.forEach((area) => {
                    areaHtml += `<option value="${area.id}">${area.areaName}</option>`;
                });
                document.getElementById("area").innerHTML = areaHtml;
            }
        );
    };

    // Responsibility is now auto-assigned on the backend — no dropdown to populate
    const getResponsiblePersons = () => {};

</script>

</html>
