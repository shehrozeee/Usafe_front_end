<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Risk Assessment</title>

    <!-- Fonts (usafe-global.css also @imports this, this preconnect just
         speeds up the first paint - same pattern as SafeUnsafeActs.html) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous" />
    <script src="https://kit.fontawesome.com/b576bd8d3c.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../../css/header.css" />
    <link rel="stylesheet" href="../../css/usafe-global.css" />
    <link rel="stylesheet" href="../../css/usafe-app.css" />
    <link rel="stylesheet" href="../../css/usafe-swal.css" />
    <link rel="stylesheet" href="../../css/loader.css" />
    <link rel="stylesheet" href="../../css/usafe-forms.css" />
    <link rel="stylesheet" href="../../css/risk-assessment.css" />
    <!-- Draft auto-save reuses the checklist wizard's 'Draft saved' toast
         (Js/GenericQuestioneerProcessor.js) verbatim - both its styling and
         its script live in these shared files, same as genericChecklist.html. -->
    <link rel="stylesheet" href="../../css/usafe-toast.css">

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"
        integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g=" crossorigin="anonymous"></script>

    <!-- HttpHandler.js's shared error path (handleRequestError) calls swal.fire
         on every failed request - every other page in the app loads sweetalert2
         for that reason. A missing sweetalert2 turns any failed request into an
         uncaught ReferenceError instead of an error dialog, so this must stay. -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.all.min.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.min.css" rel="stylesheet">

    <!-- getValue()/setValue() below come from here. A missing LocalStorage.js
         silently kills every submit (getValue is undefined, siteId can never be
         read) - this must stay loaded. -->
    <script src="../../Helpers/LocalStorage.js"></script>
    <script src="../../Global/URLS.js"></script>
    <script src="../../Helpers/HttpHandler.js"></script>
    <script src="../../Js/Authentication/CheckUser.js"></script>
    <script src="../../Helpers/Validation.js"></script>
    <script src="../../Helpers/Toast.js"></script>

    <!-- Client risk matrix (unchanged, reused as-is) + the v2 builder templates
         and the wizard logic that consumes them. -->
    <script src="../../Js/RiskMatrix.js"></script>
    <script src="../../Templates/RiskAssessmentCard.js"></script>
    <script src="../../Js/RiskAssessmentProcessor.js"></script>
</head>

<body>
    <!-- Standard in-page header, matching Pages/checklistType.html - logo,
         back arrow (leaves the wizard entirely), page title. -->
    <div class="usafe-topbar">
        <div class="topbar-back" onclick="window.history.back()">
            <i class="fas fa-arrow-left"></i>
        </div>
        <img src="../../assets/usafeLogo.png" alt="USafe">
        <h1 class="topbar-title">Risk Assessment</h1>
    </div>

    <span id="load"></span>

    <div class="page-container usafe-page-content">
        <div class="ra-page-subtitle-row">
            <div class="page-subtitle" id="raPageSubtitle">Event details</div>
            <div class="ra-progress-count" id="raProgressCount"></div>
        </div>

        <div id="riskAssessmentRoot">
            <!-- Header page: Activity, Type of Activity, Location, Event Activities,
                 plus Department/Area (needed by the save payload, carried over from
                 v1's header step - there is no other source for them since v2 has no
                 template to inherit them from). Nothing is prefilled; the assessor
                 types all of it. -->
            <div id="raHeaderStep" class="ra-screen ra-header-screen">
                <div class="ra-section-title"><i class="fas fa-clipboard-list"></i> Event Details</div>
                <div class="form-group">
                    <label for="raActivity">Activity</label>
                    <input type="text" id="raActivity" class="form-control" placeholder="What is being assessed?">
                </div>
                <div class="form-group">
                    <label for="raTypeOfActivity">Type of Activity</label>
                    <input type="text" id="raTypeOfActivity" class="form-control">
                </div>
                <div class="form-group">
                    <label for="raLocation">Location</label>
                    <input type="text" id="raLocation" class="form-control">
                </div>
                <div class="form-group">
                    <label for="raEventActivities">Event Activities</label>
                    <textarea id="raEventActivities" class="form-control" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="raDepartment">Department</label>
                    <input type="text" id="raDepartment" class="form-control">
                </div>
                <div class="form-group">
                    <label for="raArea">Area</label>
                    <input type="text" id="raArea" class="form-control">
                </div>
                <button type="button" id="raHeaderNext" class="btn btn-primary btn-block">Continue</button>
            </div>

            <!-- Builder (list / task / hazard) and, later, the review screen -
                 everything after the header is a full-screen swap into this one
                 mount point, driven by render() in Js/RiskAssessmentProcessor.js. -->
            <div id="raScreen" style="display:none;"></div>

            <div id="raError" class="ra-error text-danger"></div>
        </div>
    </div>
</body>

</html>
