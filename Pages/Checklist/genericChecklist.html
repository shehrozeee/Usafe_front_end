<body>
    <div id="header"></div>
    <div id="wizardContainer"></div>
    <div id="resultContainer" class="wizard-form"></div>

    <script>
        $(document).ready(function(){
            var url_string = window.location.href;
            console.log('genericChecklist URL:', url_string);
            var url = new URL(url_string);
            var heading = url.searchParams.get("heading");
            console.log('genericChecklist heading:', heading);
            $('#header').html(createHeader(heading));
            GenericQuestioneerProcessor(heading);
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
